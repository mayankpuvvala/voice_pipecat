name: 10_multi_topic_single_call
judge: !include judge_text.yaml
turns:
  - user: "Do you have parking?"
    expect:
      - event: function_call
        calls:
          - name: log_interaction
  - user: "Also, can I book a table for 2026-09-20 at 12:30 PM for two? Name is ZZ-EVALTEST Divya."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: function_call
        calls:
          - name: check_availability
      - event: response
        eval: "reads back the date, time, and guest count and asks the caller to confirm before booking"
  - user: "Yes, that's right."
    send_after: { event: llm_response, delay_ms: 500 }
    # book_table, THEN the spoken confirmation -- confirmed live that
    # waiting for BOTH book_table and log_interaction before checking for a
    # spoken confirmation missed it: the harness only ever looked at
    # whatever llm_response came after log_interaction (a generic "anything
    # else?" follow-up), while the real confirmation had already gone by
    # earlier -- a false fail on a reply that was actually correct.
    #
    # log_interaction is deliberately NOT asserted here at all (it was, but
    # removed): confirmed live its position relative to the spoken
    # confirmation isn't consistent run to run -- sometimes it lands before
    # the confirmation text, sometimes after. Pinning either order caused
    # false fails on reservation flows that were otherwise completely
    # correct. Whether log_interaction fires at all is already covered by
    # turn 0 above; this turn's job is just to check the booking + spoken
    # confirmation actually happened.
    expect:
      - event: function_call
        calls:
          - name: book_table
      - event: response
        eval: "confirms the reservation"
