name: 10_multi_topic_single_call
judge: !include judge_text.yaml
turns:
  - user: "Do you have parking?"
    expect:
      - event: function_call
        calls:
          - name: log_interaction
  - user: "Also, can I book a table for 2026-09-20 at 12:30 PM for two? Name is ZZ-EVALTEST Divya."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: function_call
        calls:
          - name: check_availability
      - event: response
        eval: "reads back the date, time, and guest count and asks the caller to confirm before booking"
  - user: "Yes, that's right."
    send_after: { event: llm_response, delay_ms: 500 }
    # book_table, THEN the spoken confirmation, THEN log_interaction --
    # confirmed live as the bot's actual (correct) chronological order:
    # book_table and log_interaction land in separate rounds either side of
    # the spoken confirmation text, not both before it. The previous
    # expect: waited for BOTH function calls before checking for a spoken
    # confirmation, so it only ever looked at whatever llm_response came
    # AFTER log_interaction (a generic "anything else?" follow-up) and
    # missed the real confirmation ("Your table is confirmed for two on
    # September 20th at 12:30 PM...") that had already gone by earlier --
    # a false fail on a reply that was actually correct.
    expect:
      - event: function_call
        calls:
          - name: book_table
      - event: response
        eval: "confirms the reservation"
      - event: function_call
        calls:
          - name: log_interaction
