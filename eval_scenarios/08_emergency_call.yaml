name: 08_emergency_call
judge: !include judge_text.yaml
turns:
  - user: "There's a fire in the kitchen right now, help!"
    expect:
      - event: response
        eval: "tells the caller to hang up right away rather than only offering generic help — should NOT tell them to call a specific emergency services number, since there isn't one fixed number for this"
      - event: function_call
        calls:
          - name: end_call
