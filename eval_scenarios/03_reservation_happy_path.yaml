name: 03_reservation_happy_path
judge: !include judge_text.yaml
turns:
  - user: "Hi, I'd like to make a reservation."
  - user: "The name is ZZ-EVALTEST Rahul."
    send_after: { event: llm_response, delay_ms: 500 }
  - user: "Four of us."
    send_after: { event: llm_response, delay_ms: 500 }
  - user: "Tomorrow, 2026-09-05, at 8 PM please."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: function_call
        calls:
          - name: check_availability
            args: { date: "2026-09-05", time: "20:00" }
      - event: response
        eval: "reads back the date, time, and guest count and asks the caller to confirm before booking"
  - user: "Yes, please."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: function_call
        calls:
          - name: book_table
            args: { caller_name: "ZZ-EVALTEST Rahul" }
          - name: log_interaction
      - event: response
        eval: "confirms the table is booked"
