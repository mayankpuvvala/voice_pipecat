name: 05_reservation_missing_name
judge: !include judge_text.yaml
turns:
  - user: "I want a table for 2026-09-09 at 8 PM, for two people."
    expect:
      - event: response
        eval: "asks the caller for their name before booking, and does not confirm a reservation is booked yet"
  - user: "It's ZZ-EVALTEST Karan."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: response
        eval: "reads back the date, time, and guest count and asks the caller to confirm before booking"
  - user: "Yes, that's right."
    send_after: { event: llm_response, delay_ms: 500 }
    expect:
      - event: function_call
        calls:
          - name: book_table
            args: { caller_name: "ZZ-EVALTEST Karan" }
      - event: response
        eval: "confirms the table is booked"
